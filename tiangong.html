<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>膜式壁焊接机器人产线</title>
        <link rel="stylesheet" href="assets/css/main.css" />
        <script src="assets/js/mqttws31.min.js"></script>
    </head>
    <body>
        <div id="container">
            <!-- 左侧 3D 渲染区域 -->
            <div id="viewer-container">
                <!-- 现场监控浮层 -->
                <div class="monitor-overlay-container" id="monitor-container">
                    <!-- 动态生成监控卡片 -->
                </div>

                <!-- 加载提示 -->
                <div id="loading">
                    <div class="loading-spinner"></div>
                    正在加载膜式壁焊接机器人产线模型...
                </div>
                <!-- 错误提示 -->
                <div id="error"></div>
            </div>

            <!-- 右侧控制面板区域 -->
            <div id="control-panel">
                <h2>控制面板</h2>

                <!-- 动态生成的关节控制滑块将插入此处 -->
                <div id="joints-container">
                    <!-- 动态生成的关节控制界面 -->
                </div>
            </div>
        </div>

        <script type="module">
            import { TiangongSimulator } from "./assets/js/simulator.js";
            import { MonitorManager } from "./assets/js/monitor.js";
            import { SocketManager } from "./assets/js/socket.js";

            // 页面加载完成后启动应用
            window.addEventListener("DOMContentLoaded", () => {
                // 1. 初始化 3D 仿真器
                window.simulator = new TiangongSimulator();

                // 2. 初始化视频监控
                const monitorManager = new MonitorManager("monitor-container");
                monitorManager.init();

                // 3. 初始化 MQTT Socket
                const mqttConfig = {
                    hostname: "mqtt.cgboiler.com",
                    port: 443,
                    topic: "cgRobot_tg_msb",
                    userName: "cgIOT",
                    password: "!Znhzx2024",
                    useSSL: true
                };

                window.socketManager = new SocketManager(mqttConfig, (data, topic) => {
                    console.log(`收到来自主题 [${topic}] 的消息:`, data);

                    // 这里可以根据收到的数据更新机器人状态
                    // 例如：if (data.robotKey) window.setRobotData(data.robotKey, data.patch);
                });

                // 4. 暴露全局接口方便外部调用
                window.tgGetState = () => window.simulator.state;

                window.setRobotData = (robotKey, patch) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r) return;
                    Object.assign(r, patch || {});
                    window.simulator.applyState();
                };

                window.setRobotJoints = (robotKey, jointsPatch) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r || !jointsPatch) return;
                    Object.entries(jointsPatch).forEach(([name, val]) => {
                        r.joints[name] = val;
                    });
                    window.simulator.applyState();
                };

                window.setJointValue = (jointName, value) => {
                    if (typeof jointName !== "string") return;
                    if (jointName.startsWith("joint1")) {
                        window.simulator.state.robots.Link1.joints[jointName] = value;
                    } else if (jointName.startsWith("joint2")) {
                        window.simulator.state.robots.Link2.joints[jointName] = value;
                    }
                    window.simulator.applyState();
                };

                window.setWelding = (robotKey, isWelding) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r) return;
                    r.welding = !!isWelding;
                    window.simulator.applyState();
                };
            });
        </script>
    </body>
</html>
