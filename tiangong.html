<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>膜式壁焊接机器人产线</title>
        <link rel="stylesheet" href="assets/css/main.css" />
        <script src="assets/js/mqttws31.min.js"></script>
    </head>
    <body>
        <div id="container">
            <!-- 左侧 3D 渲染区域 -->
            <div id="viewer-container">
                <!-- 加载提示 -->
                <div id="loading">
                    <div class="loading-spinner"></div>
                    正在加载膜式壁焊接机器人产线模型...
                </div>
                <!-- 错误提示 -->
                <div id="error"></div>
            </div>

            <!-- 右侧控制面板区域 -->
            <div id="control-panel">
                <h2 class="panel-main-title">生产监控与控制</h2>

                <!-- 监控区域 -->
                <div class="monitor-overlay-container" id="monitor-container">
                    <!-- 动态生成监控卡片 -->
                </div>

                <!-- 数据指标区域 -->
                <div id="stats-container" class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">今日产量</div>
                        <div class="stat-value">
                            1,248
                            <span class="stat-unit">m</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">运行效率</div>
                        <div class="stat-value">
                            94.2
                            <span class="stat-unit">%</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">故障预警</div>
                        <div class="stat-value warning">无</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">任务进度</div>
                        <div class="stat-value">
                            68
                            <span class="stat-unit">%</span>
                        </div>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 关节控制 -->
                <div id="joints-container">
                    <!-- 动态生成的关节控制界面 -->
                </div>
            </div>
        </div>

        <script type="module">
            import { TiangongSimulator } from "./assets/js/simulator.js";
            import { MonitorManager } from "./assets/js/monitor.js";
            import { SocketManager } from "./assets/js/socket.js";

            // 页面加载完成后启动应用
            window.addEventListener("DOMContentLoaded", () => {
                // 1. 初始化 3D 仿真器
                window.simulator = new TiangongSimulator();

                // 2. 初始化视频监控
                const monitorManager = new MonitorManager("monitor-container");
                monitorManager.init();

                // 3. 初始化 MQTT Socket
                const mqttConfig = {
                    hostname: "mqtt.cgboiler.com",
                    port: 443,
                    topic: "tgRobot_status",
                    userName: "cgIOT",
                    password: "!Znhzx2024",
                    useSSL: true
                };

                // 全局变量：记录每个机器人最后一次接收的时间戳
                const lastRobotTime = {
                    tgRobot_1: 0,
                    tgRobot_2: 0
                };

                window.socketManager = new SocketManager(mqttConfig, (data, topic) => {
                    // 根据收到的数据更新机器人状态
                    if (!data || !data.robotId) return;

                    const robotId = data.robotId;
                    const currentTime = data.time || 0;

                    // 消息去重：如果收到的消息时间戳小于等于上次记录的时间戳，丢弃消息
                    if (currentTime <= lastRobotTime[robotId]) {
                        console.log(`丢弃旧消息: ${robotId}, time: ${currentTime}`);
                        return;
                    }

                    // 更新时间戳
                    lastRobotTime[robotId] = currentTime;

                    // 根据robotId判断是1号还是2号机器人
                    const robotKey = robotId === "tgRobot_1" ? "Link1" : "Link2";

                    // 判断当前状态
                    let status = "等待";
                    let isWelding = false;

                    if (data.emergencyStatus === 1) {
                        status = "急停";
                    } else if (data.movStatus === 1) {
                        status = "运行中";
                        isWelding = true;
                    }

                    console.log(`${robotId} 状态: ${status}`);

                    // 更新机器人关节角度
                    if (data.jnts && Array.isArray(data.jnts) && data.jnts.length >= 6) {
                        const jointUpdates = {};
                        const prefix = robotId === "tgRobot_1" ? "joint1" : "joint2";

                        for (let i = 0; i < 6; i++) {
                            const jointName = `${prefix}-${i + 1}`;
                            jointUpdates[jointName] = (data.jnts[i] * Math.PI) / 180;
                        }

                        if (window.setRobotJoints) {
                            window.setRobotJoints(robotKey, jointUpdates);
                        }
                    }

                    // 更新机器人其他状态信息
                    if (window.setRobotData) {
                        window.setRobotData(robotKey, {
                            status: status,
                            welding: isWelding,
                            tcpSpeed: data.tcpSpeed || 0,
                            motionPercent: data.motionExecutionPercent || 0
                        });
                    }
                });

                // 4. 暴露全局接口方便外部调用
                window.tgGetState = () => window.simulator.state;

                window.setRobotData = (robotKey, patch) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r) return;
                    Object.assign(r, patch || {});
                    window.simulator.applyState();
                };

                window.setRobotJoints = (robotKey, jointsPatch) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r || !jointsPatch) return;
                    Object.entries(jointsPatch).forEach(([name, val]) => {
                        r.joints[name] = val;
                    });
                    window.simulator.applyState();
                };

                window.setJointValue = (jointName, value) => {
                    if (typeof jointName !== "string") return;
                    if (jointName.startsWith("joint1")) {
                        window.simulator.state.robots.Link1.joints[jointName] = value;
                    } else if (jointName.startsWith("joint2")) {
                        window.simulator.state.robots.Link2.joints[jointName] = value;
                    }
                    window.simulator.applyState();
                };

                window.setWelding = (robotKey, isWelding) => {
                    const r = window.simulator.state.robots[robotKey];
                    if (!r) return;
                    r.welding = !!isWelding;
                    window.simulator.applyState();
                };
            });
        </script>
    </body>
</html>
