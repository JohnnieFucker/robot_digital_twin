<!DOCTYPE html>
<html lang="zh">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>1号机监控系统 - 膜式壁焊接机器人</title>
        <link rel="stylesheet" href="assets/css/main.css" />
        <style>
            body {
                background: #020408;
                margin: 0;
                padding: 0;
                height: 100vh;
                display: flex;
                flex-direction: column;
                font-family: "Microsoft YaHei", Arial, sans-serif;
            }

            .header {
                height: 60px;
                background: rgba(10, 15, 25, 0.9);
                border-bottom: 2px solid rgba(79, 195, 247, 0.3);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 30px;
                backdrop-filter: blur(15px);
                z-index: 100;
                box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            }

            .header-left {
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .header h1 {
                color: #4fc3f7;
                font-size: 1.4em;
                margin: 0;
                text-shadow: 0 0 15px rgba(79, 195, 247, 0.4);
                display: flex;
                align-items: center;
                gap: 12px;
                font-weight: 700;
                letter-spacing: 1px;
            }

            .status-indicator {
                display: flex;
                align-items: center;
                gap: 8px;
                background: rgba(79, 195, 247, 0.1);
                padding: 4px 12px;
                border-radius: 20px;
                border: 1px solid rgba(79, 195, 247, 0.2);
            }

            .pulse-dot {
                width: 10px;
                height: 10px;
                background: #4caf50;
                border-radius: 50%;
                box-shadow: 0 0 8px #4caf50;
                animation: pulse 2s infinite;
            }

            .status-text {
                font-size: 0.85em;
                color: #a0c4ff;
                font-weight: 500;
            }

            .split-container {
                display: flex;
                flex: 1;
                overflow: hidden;
                padding: 15px;
                gap: 15px;
                background: #05080f;
            }

            .monitor-panel {
                flex: 1;
                position: relative;
                background: #000;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid rgba(79, 195, 247, 0.2);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
                transition: all 0.3s ease;
            }

            .monitor-panel:hover {
                border-color: rgba(79, 195, 247, 0.5);
                box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(79, 195, 247, 0.1);
            }

            .monitor-label {
                position: absolute;
                top: 20px;
                left: 20px;
                background: rgba(0, 0, 0, 0.7);
                color: #4fc3f7;
                padding: 10px 20px;
                border-radius: 6px;
                border-left: 4px solid #4fc3f7;
                font-weight: bold;
                z-index: 10;
                pointer-events: none;
                backdrop-filter: blur(10px);
                text-transform: uppercase;
                letter-spacing: 2px;
                font-size: 1em;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            }

            .monitor-overlay {
                position: absolute;
                bottom: 20px;
                right: 20px;
                display: flex;
                flex-direction: column;
                gap: 5px;
                align-items: flex-end;
                z-index: 5;
            }

            .badge {
                padding: 2px 8px;
                background: rgba(255, 255, 255, 0.1);
                color: rgba(255, 255, 255, 0.6);
                border-radius: 4px;
                font-size: 0.7em;
                font-family: monospace;
            }

            iframe {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }

            .nav-link {
                color: rgba(255, 255, 255, 0.5);
                text-decoration: none;
                font-size: 0.9em;
                transition: all 0.2s;
                display: flex;
                align-items: center;
                gap: 5px;
            }

            .nav-link:hover {
                color: #4fc3f7;
            }

            @keyframes pulse {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                50% {
                    opacity: 0.5;
                    transform: scale(1.1);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* 扫描线效果 */
            .monitor-panel::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
                background-size: 100% 4px, 3px 100%;
                pointer-events: none;
                z-index: 2;
                opacity: 0.1;
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div class="header-left">
                <h1>1号机 实时监控系统</h1>
                <div class="status-indicator">
                    <div class="pulse-dot"></div>
                    <span class="status-text">系统运行中</span>
                </div>
            </div>
            <a href="tiangong.html" class="nav-link">返回 3D 数字孪生 &rsaquo;</a>
        </div>
        <div class="split-container">
            <div class="monitor-panel">
                <div class="monitor-label">熔池监控 (Weld Pool)</div>
                <iframe src="http://10.13.120.108:8889/weldpool/?autoplay=1&controls=0" allow="autoplay; fullscreen"></iframe>
                <div class="monitor-overlay"></div>
            </div>
            <div class="monitor-panel">
                <div class="monitor-label">跟踪监控 (Laser Track)</div>
                <iframe src="http://10.13.120.108:8889/lasertrack/?autoplay=1&controls=0" allow="autoplay; fullscreen"></iframe>
                <div class="monitor-overlay"></div>
            </div>
        </div>
    </body>
</html>
